<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Bibliothèque des savoirs</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header>
    <h1>Ma bibliothèque des savoirs</h1>

    <p>
      Je recense ici mes livres, films, albums, documentaires
      et prises de notes.
    </p>
  </header>

  <main>
    <!-- Filtres par type -->
    <section id="filters">
      <button type="button" data-type="Tous">Tous</button>
      <button type="button" data-type="Livre">Livres</button>
      <button type="button" data-type="Film">Films</button>
      <button type="button" data-type="Album">Albums</button>
    </section>

    <!-- Barre de recherche -->
    <section id="search-section">
      <input
        type="text"
        id="search-input"
        placeholder="Rechercher une œuvre..."
      />
    </section>

    <!-- Formulaire d'ajout -->
    <section id="form-section">
      <h2>Ajouter une œuvre</h2>

      <form id="item-form">
        <input
          type="text"
          id="title"
          placeholder="Titre"
          required
        />

        <input
          type="text"
          id="creator"
          placeholder="Créateur"
          required
        />

        <select id="type">
          <option value="Livre">Livre</option>
          <option value="Film">Film</option>
          <option value="Album">Album</option>
        </select>

        <input
          type="number"
          id="rating"
          min="1"
          max="5"
          placeholder="Note /5"
          required
        />

        <input
          type="text"
          id="tags"
          placeholder="Tags séparés par des virgules"
        />

        <button type="submit">Ajouter</button>
      </form>
    </section>

    <!-- Zone d'affichage des cartes -->
    <section id="detail-view" class="hidden"></section>
    <section id="library"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
